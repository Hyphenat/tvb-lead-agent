name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt ruff
      - name: Lint
        run: python -m ruff check src app tests
      - name: Run test suite
        run: python -m pytest -q
      - name: Verify no secrets are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|secrets\.toml$'; then
            echo "Secret file committed"; exit 1
          fi
          echo "No secret files tracked."
